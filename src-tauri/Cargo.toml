[package]
name = "kaury-clean"
version = "0.2.0"
description = "Kaury Clean, un nettoyeur de PC Windows"
authors = ["Kaury Studio"]
edition = "2021"

[lib]
name = "kaury_clean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
walkdir = "2"
blake3 = { version = "1", features = ["pure"] }
dirs = "6"
trash = "5"
sysinfo = { version = "0.37", default-features = false, features = ["disk", "system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
