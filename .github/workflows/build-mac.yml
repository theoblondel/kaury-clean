name: Build macOS

on:
  push:
    branches: [main, mac]
  pull_request:
  workflow_dispatch:
  # Une release publiée reçoit aussi son .dmg, à côté de l'installeur Windows.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Une seule appli « universelle » : Mac Apple (M1 et suivants) et Mac Intel.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Signature « ad hoc » (signingIdentity "-" dans tauri.conf.json) : obligatoire pour lancer
      # l'appli sur un Mac Apple. Pas de notarisation : pas de compte Apple Developer.
      - name: Build du .dmg
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: kaury-clean-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publier dans la release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
