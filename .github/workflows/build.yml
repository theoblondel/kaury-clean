name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build de l'installeur
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: kaury-clean-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kaury Clean ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          body: |
            ## Installer Kaury Clean

            1. Télécharge **Kaury Clean_…_x64-setup.exe** ci-dessous.
            2. Ouvre-le. Si Windows affiche « Windows a protégé votre ordinateur », clique sur **Informations complémentaires** puis **Exécuter quand même** (l'appli n'est pas encore signée).
            3. Suis l'installeur : Kaury Clean s'installe dans Programmes, avec un raccourci dans le menu Démarrer et sur le Bureau.

            Pour désinstaller : **Paramètres > Applications > Kaury Clean > Désinstaller**.
