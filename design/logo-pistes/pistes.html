<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kaury Clean — pistes de logo</title>
<style>
@font-face { font-family: U; font-weight: 800; src: url(../../../web/clean/src/assets/fonts/Unbounded-latin-5.woff2) format("woff2"); }
@font-face { font-family: M; font-weight: 700; src: url(../../../web/clean/src/assets/fonts/Manrope-latin-3.woff2) format("woff2"); }
* { margin: 0; box-sizing: border-box; }
body { width: 1800px; background: #F1E8CB; color: #1C1A1A; font-family: M, sans-serif; padding: 70px; }
h1 { font: 800 54px/1 U; letter-spacing: -.04em; margin-bottom: 14px; }
.sous { font-size: 22px; opacity: .7; margin-bottom: 50px; }
.grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
.piste { background: #FBF6E6; border-radius: 34px; padding: 34px; }
.piste h2 { font: 800 30px/1.1 U; letter-spacing: -.03em; margin: 22px 0 6px; }
.piste h2 span { color: #A83E0D; }
.piste p { font-size: 18px; opacity: .72; line-height: 1.45; min-height: 52px; }
.grand { width: 100%; aspect-ratio: 1; display: block; filter: drop-shadow(0 24px 30px rgba(90,50,20,.25)); }
.petits { display: flex; align-items: center; gap: 22px; margin-top: 22px; padding: 16px 20px; border-radius: 18px; background: #140F0E; }
.petits svg { display: block; }
.petits .clair { background: #F1E8CB; border-radius: 12px; padding: 10px; }
.petits small { color: #B3A994; font-size: 15px; margin-left: auto; }
</style>
</head>
<body>
<h1>Kaury Clean — pistes de logo</h1>
<p class="sous">Plus de K : la tuile orange garde le lien avec la famille Kaury, le symbole dit « nettoyer ». En bas de chaque piste : l'icône en 64, 32 et 16 px, comme dans la barre des tâches.</p>
<div class="grille" id="grille"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="tuile" viewBox="0 0 1024 1024">
      <linearGradient id="degrade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A4C"/><stop offset=".55" stop-color="#F56E2E"/><stop offset="1" stop-color="#EC6526"/></linearGradient>
      <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#degrade)"/>
    </symbol>
    <path id="etincelle" d="M0 -100 L22 -22 L100 0 L22 22 L0 100 L-22 22 L-100 0 L-22 -22 Z"/>
  </defs>
</svg>

<script>
const C = '#F1E8CB', O = '#F56E2E', B = '#1C1A1A';
const et = (x, y, s, f = C) => `<use href="#etincelle" fill="${f}" transform="translate(${x} ${y}) scale(${s})"/>`;
const pistes = [
  {
    nom: 'Le balai', n: '1',
    texte: 'Ta piste : un balai penché qui vient de passer, et une étincelle là où c\'est propre.',
    svg: `<g transform="rotate(32 512 560)">
            <rect x="490" y="150" width="44" height="420" rx="22" fill="${C}"/>
            <rect x="430" y="548" width="164" height="62" rx="22" fill="${C}"/>
            <path d="M432 628 L592 628 L668 858 Q512 902 356 858 Z" fill="${C}"/>
            <g stroke="${O}" stroke-width="16" stroke-linecap="round"><path d="M468 660 L444 862"/><path d="M512 660 L512 872"/><path d="M556 660 L580 862"/></g>
          </g>
          ${et(300, 330, 0.85)} ${et(392, 210, 0.42)}`,
  },
  {
    nom: 'Le balai net', n: '2',
    texte: 'Le même balai, dessiné droit et géométrique : il reste lisible même en tout petit.',
    svg: `<rect x="486" y="170" width="52" height="330" rx="26" fill="${C}"/>
          <rect x="400" y="486" width="224" height="70" rx="26" fill="${C}"/>
          <path d="M402 584 L622 584 L716 842 Q716 860 698 860 L326 860 Q308 860 308 842 Z" fill="${C}"/>
          <g stroke="${O}" stroke-width="18" stroke-linecap="round"><path d="M452 620 L414 830"/><path d="M512 620 L512 830"/><path d="M572 620 L610 830"/></g>
          ${et(770, 300, 0.7)}`,
  },
  {
    nom: 'Le coup de balai', n: '3',
    texte: 'Pas d\'objet, juste le geste : deux traces de balayage et l\'étincelle du travail fini.',
    svg: `<g fill="none" stroke="${C}" stroke-linecap="round">
            <path d="M232 690 Q470 470 800 520" stroke-width="92"/>
            <path d="M300 830 Q500 660 760 690" stroke-width="66"/>
          </g>
          ${et(730, 300, 1.15)} ${et(560, 250, 0.45)}`,
  },
  {
    nom: 'Le C étincelant', n: '4',
    texte: 'Un C comme Clean, ouvert comme un coup de chiffon, avec l\'étincelle dans son ouverture.',
    svg: `<path d="M700 330 A260 260 0 1 0 700 694" fill="none" stroke="${C}" stroke-width="128" stroke-linecap="round"/>
          ${et(700, 512, 1)}`,
  },
  {
    nom: 'La bulle', n: '5',
    texte: 'Une bulle de savon : propre, légère, et un reflet qui rappelle l\'ancien logo.',
    svg: `<circle cx="470" cy="540" r="250" fill="none" stroke="${C}" stroke-width="64"/>
          <path d="M340 440 A160 160 0 0 1 450 360" fill="none" stroke="${C}" stroke-width="44" stroke-linecap="round"/>
          <circle cx="770" cy="300" r="70" fill="none" stroke="${C}" stroke-width="34"/>
          <circle cx="760" cy="770" r="40" fill="${C}"/>`,
  },
  {
    nom: 'Le balai qui balaie', n: '6',
    texte: 'Le balai penché avec des traces de balayage au sol : on voit l\'action, pas seulement l\'objet.',
    svg: `<g transform="rotate(32 560 520)">
            <rect x="538" y="130" width="44" height="400" rx="22" fill="${C}"/>
            <rect x="478" y="508" width="164" height="62" rx="22" fill="${C}"/>
            <path d="M480 588 L640 588 L716 818 Q560 862 404 818 Z" fill="${C}"/>
            <g stroke="${O}" stroke-width="16" stroke-linecap="round"><path d="M516 620 L492 822"/><path d="M560 620 L560 832"/><path d="M604 620 L628 822"/></g>
          </g>
          <g fill="none" stroke="${C}" stroke-linecap="round" stroke-width="30"><path d="M190 850 Q290 810 380 825"/><path d="M200 765 Q262 738 320 745"/></g>
          ${et(310, 330, 0.7)}`,
  },
];
const icone = (p, taille, id) => `<svg viewBox="0 0 1024 1024" width="${taille}" height="${taille}"><use href="#tuile"/>${p.svg.replaceAll('id="d6"', 'id="' + id + '"').replaceAll('url(#d6)', 'url(#' + id + ')')}</svg>`;
document.getElementById('grille').innerHTML = pistes.map((p, i) => `
  <div class="piste">
    <svg class="grand" viewBox="0 0 1024 1024"><use href="#tuile"/>${p.svg}</svg>
    <h2><span>${p.n}.</span> ${p.nom}</h2>
    <p>${p.texte}</p>
    <div class="petits">${icone(p, 64, 'a' + i)}${icone(p, 32, 'b' + i)}${icone(p, 16, 'c' + i)}<span class="clair">${icone(p, 32, 'e' + i)}</span><small>64 · 32 · 16 px</small></div>
  </div>`).join('');
</script>
</body>
</html>
